name: Build FluxTV Desktop

on:
  push:
    branches:
      - desktop-app
    tags:
      - 'v*'

env:
  APP_VERSION: ${{ github.ref_name == 'desktop-app' && '1.0.0-dev' || github.ref_name }}

jobs:
  build-mac-x64:
    runs-on: macos-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set version from tag
        working-directory: ./desktop
        run: |
          echo "Setting version to ${{ env.APP_VERSION }}"
          sed -i.bak "s/\"version\": \"1.0.0\"/\"version\": \"${{ env.APP_VERSION }}\"/" package.json
          rm -f package.json.bak
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --mac --x64 --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-mac-x64
          path: desktop/release/*.dmg

  build-mac-arm64:
    runs-on: macos-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set version from tag
        working-directory: ./desktop
        run: |
          echo "Setting version to ${{ env.APP_VERSION }}"
          sed -i.bak "s/\"version\": \"1.0.0\"/\"version\": \"${{ env.APP_VERSION }}\"/" package.json
          rm -f package.json.bak
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-mac-arm64
          path: desktop/release/*.dmg

  build-win:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set version from tag
        working-directory: ./desktop
        run: |
          $version = "${{ env.APP_VERSION }}"
          Write-Host "Setting version to $version"
          $content = Get-Content package.json -Raw
          $content = $content -replace '"version": "1.0.0"', "`"version`": `"$version`""
          Set-Content package.json $content
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --win --x64 --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-win
          path: desktop/release/*.exe

  build-linux-appimage:
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set version from tag
        working-directory: ./desktop
        run: |
          echo "Setting version to ${{ env.APP_VERSION }}"
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"${{ env.APP_VERSION }}\"/" package.json
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --linux AppImage --x64 --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-linux-appimage
          path: desktop/release/*.AppImage

  build-linux-deb:
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set version from tag
        working-directory: ./desktop
        run: |
          echo "Setting version to ${{ env.APP_VERSION }}"
          sed -i "s/\"version\": \"1.0.0\"/\"version\": \"${{ env.APP_VERSION }}\"/" package.json
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --linux deb --x64 --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-linux-deb
          path: desktop/release/*.deb

  release:
    needs: [build-mac-x64, build-mac-arm64, build-win, build-linux-appimage, build-linux-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: artifacts/**/*
          name: FluxTV Desktop ${{ github.ref_name }}
          body: |
            # FluxTV Desktop ${{ github.ref_name }}
            
            ## 安装说明
            
            ### macOS
            - **Intel (x64)**: `FluxTV-${{ env.APP_VERSION }}-x64.dmg`
            - **Apple Silicon (arm64)**: `FluxTV-${{ env.APP_VERSION }}-arm64.dmg`
            
            ### Windows
            - **x64**: `FluxTV-Setup-${{ env.APP_VERSION }}.exe`
            
            ### Linux
            - **x64 (通用)**: `FluxTV-${{ env.APP_VERSION }}.AppImage`
            - **x64 (Debian/Ubuntu)**: `fluxtv-desktop_${{ env.APP_VERSION }}_amd64.deb`
            
            ## 配置直播源
            
            1. 打开应用后，点击右上角设置图标
            2. 在 API 地址中填入你的 Cloudflare Worker 地址
            3. 点击保存，然后刷新频道列表
