name: Build FluxTV Desktop

on:
  push:
    branches:
      - desktop-app
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: desktop/node_modules
          key: mac-node-${{ hashFiles('desktop/package-lock.json') }}
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --mac --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-mac
          path: desktop/release/*.dmg

  build-win:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: desktop/node_modules
          key: win-node-${{ hashFiles('desktop/package-lock.json') }}
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --win --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-win
          path: desktop/release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: desktop/node_modules
          key: linux-node-${{ hashFiles('desktop/package-lock.json') }}
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      - name: Build app
        working-directory: ./desktop
        run: |
          npm run build
          npx electron-builder --linux AppImage --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluxTV-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: artifacts/**/*
          name: FluxTV Desktop ${{ github.ref_name }}
          body: |
            # FluxTV Desktop ${{ github.ref_name }}
            
            ## 安装说明
            
            - **macOS**: `FluxTV-*.dmg`
            - **Windows**: `FluxTV-*.exe`
            - **Linux**: `FluxTV-*.AppImage` (通用) 或 `*.deb`
            
            ## 配置直播源
            
            1. 打开应用后，点击右上角设置图标
            2. 在 API 地址中填入你的 Cloudflare Worker 地址
            3. 点击保存，然后刷新频道列表
